<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的图片</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }
    img {
      width: 100vw;
      height: 100vh;
      object-fit: cover; /* 保持比例并填满全屏 */
      display: block;
    }
  </style>
</head>
<body>
  <img src="thisman.jpg" alt="全屏图片">
</body>
</html>
